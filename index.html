<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p>Organize your tasks and track your progress.</p>

        <form id="todo-form">
            <label for="todo-input">New task</label>
            <div class="input-group">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="What needs to be done?"
                    required
                >
                <button type="submit">Add Task</button>
            </div>
        </form>

        <div class="filters" aria-label="Filter tasks">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" aria-label="Your tasks"></ul>

        <div class="stats">
            <span id="items-left">0 items left</span>
            <button type="button" id="clear-completed">Clear Completed</button>
        </div>

        <p id="status-message" role="status" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
